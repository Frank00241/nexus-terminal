<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>

  <title>Nexus Terminal React</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
  <!-- Versions exactes, builds de production et empreintes SRI (sha384 calculé
       sur les fichiers des paquets npm) : un fichier changé côté CDN est refusé. -->
  <script crossorigin="anonymous" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj"></script>
  <style>
    :root,[data-theme="light"]{--bg:#f5f3ef;--card:#faf8f4;--card2:#fff;--deep:#efebe5;--border:#d4d1ca;--text:#1f1f1d;--muted:#6e6c66;--green:#3f8b44;--blue:#006494;--yellow:#d19900;--red:#a83a4b;--purple:#7a39bb;--shadow:0 12px 24px rgba(0,0,0,.08)}
    [data-theme="dark"]{--bg:#0d1117;--card:#161b22;--card2:#1c2128;--deep:#11161d;--border:#21262d;--text:#e6edf3;--muted:#8b949e;--green:#3fb950;--blue:#58a6ff;--yellow:#f5a623;--red:#f85149;--purple:#e879f9;--shadow:0 18px 30px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Satoshi',system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    .app{max-width:1440px;margin:0 auto;padding:16px}.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}.p{padding:16px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:var(--muted)}
    .btn{border:1px solid var(--border);background:transparent;color:var(--text);padding:10px 14px;border-radius:12px}.btn.primary{background:var(--blue);color:#fff;border-color:transparent}.btn.active{border-color:var(--blue);color:var(--blue);background:rgba(88,166,255,.08)}
    .grid-top{display:grid;grid-template-columns:1.2fr .9fr;gap:16px;margin-bottom:16px}.market{display:flex;gap:18px;overflow:auto;padding:12px 16px;margin-bottom:16px;white-space:nowrap}.market-item{min-width:max-content}.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer}.card.active{background:var(--card2)}.ticker{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;border:1px solid currentColor;font-size:11px;font-weight:700;text-transform:uppercase}.price{font-size:28px;font-weight:700}.up{color:var(--green)}.down{color:var(--red)}
    .mini{height:58px;margin:10px 0}.meta3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.metric{background:var(--deep);border:1px solid var(--border);padding:10px;border-radius:12px}.k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.v{font-size:14px;font-weight:700;margin-top:3px}.range{height:6px;border-radius:999px;background:var(--border);position:relative;margin-top:10px}.dot{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%)}
    .detail{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.stack{display:grid;gap:16px}.subtabs,.tabs{display:flex;gap:8px;flex-wrap:wrap}.subview{display:none}.subview.active{display:block}.chart{height:280px}.heatmap-wrap,.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
    .heat{padding:8px;border-radius:10px;text-align:center;font-weight:700;border:1px solid transparent}.guide{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}.guide-box{max-width:620px;width:100%;max-height:80vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px}
    @media (max-width:1024px){.grid-top,.detail{grid-template-columns:1fr}} @media (max-width:640px){.meta3{grid-template-columns:1fr}.app{padding:10px}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;
const BASE={NVDA:{name:'NVIDIA',sector:'Semi-IA',base:183.91,color:'#76b900',t1:196,t2:212,t3:268,stop:162,entryLow:175,entryHigh:182,pe:36,fwdPe:28,rev:130.5,revGrowth:78,grossMargin:73,signal:'ACHETER',signalDesc:'Signal convergent confirmé.',pilier:'Pilier 1',conviction:5,mktcap:'4.42T',eps:1.62,nextEps:1.76,earningsDate:'20 mai 2026',low52:95.04,high52:212.19,thesis:'Leader GPU IA, supercycle intact.',risks:'Export Chine, concurrence, valorisation élevée.',hist:[138,140,143,148,153,158,162,167,171,175,178,180,183.91],peers:[['AMD',80,34,57,'JUSTE','#f5a623'],['AVGO',35,25,65,'JUSTE','#f5a623'],['TSMC',25,38,58,'SOUS','#3fb950']]},AMD:{name:'AMD',sector:'Semi-IA',base:236.64,color:'#ed1c24',t1:250,t2:267,t3:289,stop:207,entryLow:220,entryHigh:228,pe:80,fwdPe:45,rev:10.27,revGrowth:34,grossMargin:57,signal:'SURVEILLER',signalDesc:'Momentum fort à surveiller.',pilier:'Pilier 1-2',conviction:4,mktcap:'385.8B',eps:1.53,nextEps:1.27,earningsDate:'5 mai 2026',low52:76.48,high52:267.08,thesis:'Challenger crédible IA infra.',risks:'PE élevé, proche sommet 52 semaines.',hist:[130,138,148,158,168,175,182,190,198,206,215,224,236.64],peers:[['NVDA',36,78,73,'SOUS','#3fb950'],['MRVL',50,27,50,'JUSTE','#f5a623'],['QCOM',15,12,56,'SOUS','#3fb950']]},ORCL:{name:'Oracle',sector:'Cloud IA',base:143.09,color:'#f80000',t1:165,t2:200,t3:261,stop:122,entryLow:135,entryHigh:143,pe:24.74,fwdPe:20,rev:17.2,revGrowth:22,grossMargin:32,signal:'ACHETER',signalDesc:'Opportunité contrariante.',pilier:'Pilier 1',conviction:4,mktcap:'396B',eps:1.47,nextEps:1.55,earningsDate:'Juin 2026',low52:118.86,high52:345.72,thesis:'Transformation cloud réelle.',risks:'FCF négatif, capex lourd.',hist:[290,310,330,345,310,270,230,200,175,160,152,148,143.09],peers:[['MSFT',32,14,45,'JUSTE','#f5a623'],['AMZN',38,17,39,'JUSTE','#f5a623'],['GOOGL',22,28,18,'SOUS','#3fb950']]},TSLA:{name:'Tesla',sector:'EV IA',base:345.62,color:'#cc0000',t1:374,t2:420,t3:465,stop:305,entryLow:310,entryHigh:325,pe:321,fwdPe:185,rev:24.9,revGrowth:-10,grossMargin:18,signal:'ATTENDRE',signalDesc:'Risque binaire pré-earnings.',pilier:'Pilier 3',conviction:2,mktcap:'1.297T',eps:1.08,nextEps:0.39,earningsDate:'22 avr 2026',low52:222.79,high52:498.83,thesis:'Asymétrie robotaxi/FSD.',risks:'PE extrême, livraisons en baisse.',hist:[420,460,490,480,450,430,415,400,390,380,365,353,345.62],peers:[['BYD',12,45,19,'SOUS','#3fb950'],['RIVN',999,16,-9,'SPEC','#8b949e'],['F',6,3,15,'SOUS','#3fb950']]}};
const MARKET=[['S&P 500','5 760',-0.33],['Nasdaq','22 822',0.83],['TSX','33 620 CAD',1.15],['VIX','19.27',-1.13],['WTI','97.43',3.20],['Or','4 786',-0.66],['USDCAD','1.386',-0.09],['10Y US','4.293',0.05],['Bitcoin','71.6K',0.84]];
const GUIDES={signal:'ACHETER = plusieurs facteurs alignés. SURVEILLER = setup intéressant mais timing incomplet. ATTENDRE = risque ou prix défavorable.',heatmap:'Vert favorable, jaune neutre, rouge risqué. Clique les colonnes pour trier.',radar:'Le radar compare croissance, marge, valorisation inverse, momentum et conviction.',rr:'Au-dessus de 3:1 excellent; 2:1 acceptable; en dessous à éviter sauf contexte exceptionnel.'};
const signalRank={ACHETER:3,SURVEILLER:2,ATTENDRE:1};
const fmt=n=>Number(n).toFixed(2), pct=n=>(n>0?'+':'')+n.toFixed(2)+'%';
const colorSignal=s=>s==='ACHETER'?'var(--green)':s==='SURVEILLER'?'var(--yellow)':'var(--red)';
const stars=n=>Array.from({length:5},(_,i)=><span key={i} style={{color:i<n?'var(--yellow)':'var(--border)'}}>★</span>);
const jitter=v=>+(v*(1+(Math.random()-.5)*0.01)).toFixed(2);
function Spark({values,color}){const w=260,h=58,p=4,min=Math.min(...values),max=Math.max(...values),span=(max-min)||1;const pts=values.map((v,i)=>`${(i/(values.length-1))*w},${h-p-((v-min)/span)*(h-p*2)}`).join(' ');return <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"><polyline fill="none" stroke={color} strokeWidth="2.1" points={pts}/></svg>}
function Area({values,color,refs=[]}){const w=700,h=260,p=22,min=Math.min(...values,...refs),max=Math.max(...values,...refs),span=(max-min)||1;const pt=i=>({x:(i/(values.length-1))*(w-p*2)+p,y:h-p-((values[i]-min)/span)*(h-p*2)});const pts=values.map((_,i)=>{const q=pt(i);return `${q.x},${q.y}`}).join(' ');const area=`${p},${h-p} ${pts} ${w-p},${h-p}`;return <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none"><defs><linearGradient id="a" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".35"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>{refs.map((r,i)=>{const y=h-p-((r-min)/span)*(h-p*2);return <line key={i} x1={p} x2={w-p} y1={y} y2={y} stroke={color} strokeDasharray="6 5" opacity=".4"/>})}<polygon points={area} fill="url(#a)"/><polyline fill="none" stroke={color} strokeWidth="3" points={pts}/></svg>}
function App(){
  const [prices,setPrices]=useState(Object.fromEntries(Object.entries(BASE).map(([k,v])=>[k,v.base])));
  const [active,setActive]=useState('NVDA'); const [view,setView]=useState('overview'); const [tab,setTab]=useState('chart'); const [guide,setGuide]=useState(null); const [sort,setSort]=useState('conviction'); const [filter,setFilter]=useState('ALL'); const [search,setSearch]=useState(''); const [intervalMs,setIntervalMs]=useState(5000); const [theme,setTheme]=useState('dark'); const [lastUpdate,setLastUpdate]=useState(new Date().toLocaleTimeString('fr-FR')); const [heatSort,setHeatSort]=useState('PE');
  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme)},[theme]);
  useEffect(()=>{const id=setInterval(()=>{setPrices(prev=>{const n={...prev}; Object.keys(n).forEach(k=>n[k]=jitter(n[k])); return n}); setLastUpdate(new Date().toLocaleTimeString('fr-FR'));}, intervalMs); return ()=>clearInterval(id)},[intervalMs]);
  useEffect(()=>{const onKey=e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return; if(['1','2','3','4'].includes(e.key)) setView(['overview','detail','heatmap','compare'][Number(e.key)-1]); const keys=tickers; let idx=keys.indexOf(active); if(e.key==='ArrowRight'){setActive(keys[(idx+1)%keys.length]||active); setView('detail')} if(e.key==='ArrowLeft'){setActive(keys[(idx-1+keys.length)%keys.length]||active); setView('detail')}}; addEventListener('keydown',onKey); return ()=>removeEventListener('keydown',onKey)});
  const getChange=k=>((prices[k]-BASE[k].base)/BASE[k].base)*100; const getUpside=k=>Math.round(((BASE[k].t3-prices[k])/prices[k])*100); const pos52=k=>Math.max(0,Math.min(100,((prices[k]-BASE[k].low52)/(BASE[k].high52-BASE[k].low52))*100));
  const tickers=useMemo(()=>{let keys=Object.keys(BASE); if(filter!=='ALL') keys=keys.filter(k=>BASE[k].signal===filter); if(search) keys=keys.filter(k=>k.includes(search.toUpperCase())||BASE[k].name.toLowerCase().includes(search.toLowerCase())); const sorters={conviction:(a,b)=>BASE[b].conviction-BASE[a].conviction,upside:(a,b)=>getUpside(b)-getUpside(a),signal:(a,b)=>signalRank[BASE[b].signal]-signalRank[BASE[a].signal],price:(a,b)=>prices[b]-prices[a],growth:(a,b)=>BASE[b].revGrowth-BASE[a].revGrowth}; return keys.sort(sorters[sort])},[filter,search,sort,prices]);
  const activeBase=BASE[active]; const activePrice=prices[active]; const entryMid=(activeBase.entryLow+activeBase.entryHigh)/2; const rr=v=>((v-entryMid)/(entryMid-activeBase.stop)).toFixed(1);
  const heatVal=(k,m)=>m==='PE'?Math.min(BASE[k].pe,300):m==='Growth'?BASE[k].revGrowth:m==='Margin'?BASE[k].grossMargin:m==='Upside'?getUpside(k):BASE[k].conviction*20;
  const heatColor=(v,m)=>m==='PE'?(v<40?'var(--green)':v<80?'var(--yellow)':'var(--red)'):m==='Growth'?(v>30?'var(--green)':v>0?'var(--yellow)':'var(--red)'):m==='Margin'?(v>60?'var(--green)':v>30?'var(--yellow)':'var(--red)'):m==='Upside'?(v>30?'var(--green)':v>10?'var(--yellow)':'var(--red)'):(v>=80?'var(--green)':v>=60?'var(--yellow)':'var(--red)');
  const radarDims=['Croissance','Marge','Valorisation','Momentum','Conviction'];
  const radarValue=(k,d)=>d==='Croissance'?Math.min(Math.max(BASE[k].revGrowth,0),100):d==='Marge'?BASE[k].grossMargin:d==='Valorisation'?Math.max(0,100-Math.min(BASE[k].pe,100)):d==='Momentum'?pos52(k):BASE[k].conviction*20;
  const Radar=()=>{const cx=180,cy=160,r=110,colors=['#76b900','#ed1c24','#f80000','#cc0000']; const angle=i=>(Math.PI*2/radarDims.length)*i-Math.PI/2; return <svg viewBox="0 0 360 320">{[25,50,75,100].map((l,i)=><polygon key={i} points={radarDims.map((_,j)=>`${cx+Math.cos(angle(j))*r*(l/100)},${cy+Math.sin(angle(j))*r*(l/100)}`).join(' ')} fill="none" stroke="var(--border)"/>) } {radarDims.map((d,i)=><g key={d}><line x1={cx} y1={cy} x2={cx+Math.cos(angle(i))*r} y2={cy+Math.sin(angle(i))*r} stroke="var(--border)"/><text x={cx+Math.cos(angle(i))*(r+18)} y={cy+Math.sin(angle(i))*(r+18)} fill="var(--muted)" fontSize="11" textAnchor="middle">{d}</text></g>)} {tickers.slice(0,4).map((k,idx)=><polygon key={k} points={radarDims.map((d,i)=>`${cx+Math.cos(angle(i))*r*(radarValue(k,d)/100)},${cy+Math.sin(angle(i))*r*(radarValue(k,d)/100)}`).join(' ')} fill={colors[idx]+'22'} stroke={colors[idx]} strokeWidth="2"/> )}</svg>};
  return <div className="app">
    <div className="between" style={{marginBottom:16}}>
      <div className="row"><div style={{width:42,height:42,borderRadius:12,display:'grid',placeItems:'center',border:'1px solid var(--border)',background:'var(--card)'}}><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="var(--blue)" strokeWidth="1.9"><path d="M4 16l5-5 3 3 7-9"/><path d="M17 5h3v3"/></svg></div><div><div className="eyebrow">Empire Capital</div><div style={{fontFamily:'General Sans',fontSize:30,fontWeight:700,lineHeight:1.05}}>Nexus Terminal React</div><div className="muted">Version fonctionnelle complète inspirée du fichier JSX</div><div style={{color:'var(--yellow)',fontSize:12,fontWeight:700}}>🟡 SIMULÉ · Prix fictifs, variation aléatoire · Pas un conseil financier</div></div></div>
      <div className="row"><button className="btn" onClick={()=>setTheme(theme==='dark'?'light':'dark')}>Thème</button><button className="btn primary" onClick={()=>{setPrices(prev=>{const n={...prev}; Object.keys(n).forEach(k=>n[k]=jitter(n[k])); return n}); setLastUpdate(new Date().toLocaleTimeString('fr-FR'));}}>Actualiser</button></div>
    </div>
    <div className="panel market">{MARKET.map(([l,v,chg])=><div key={l} className="market-item"><div className="eyebrow" style={{letterSpacing:'.1em'}}>{l}</div><div style={{fontWeight:700}}>{v}</div><div className={chg>=0?'up':'down'}>{chg>0?'+':''}{chg}%</div></div>)}<div className="market-item" style={{marginLeft:'auto'}}><div className="eyebrow">Dernière maj</div><div style={{fontWeight:700}}>{lastUpdate}</div><div className="muted">Flux simulé</div></div></div>
    <div className="grid-top">
      <div className="panel p"><div className="eyebrow">Décision immédiate</div><div style={{fontSize:24,fontWeight:700,margin:'6px 0 10px'}}>Scanner, comparer, décider</div><div className="muted">Cette version structure réellement le terminal : scan, détail, heatmap triable, comparatif, guides et navigation clavier.</div></div>
      <div className="panel p"><div className="row"><div className="row" style={{flex:1}}><div className="btn" style={{display:'flex',alignItems:'center',gap:8}}><span className="muted">Recherche</span><input value={search} onChange={e=>setSearch(e.target.value)} style={{background:'transparent',border:'none',outline:'none',color:'inherit'}} placeholder="NVDA, AMD..."/></div><div className="btn" style={{display:'flex',alignItems:'center',gap:8}}><span className="muted">Trier</span><select value={sort} onChange={e=>setSort(e.target.value)} style={{background:'transparent',border:'none',color:'inherit'}}><option value="conviction">Conviction</option><option value="upside">Upside</option><option value="signal">Signal</option><option value="price">Prix</option><option value="growth">Croissance</option></select></div></div><div className="row"><div className="btn" style={{display:'flex',alignItems:'center',gap:8}}><span className="muted">Filtre</span><select value={filter} onChange={e=>setFilter(e.target.value)} style={{background:'transparent',border:'none',color:'inherit'}}><option value="ALL">Tous</option><option value="ACHETER">Acheter</option><option value="SURVEILLER">Surveiller</option><option value="ATTENDRE">Attendre</option></select></div><div className="btn" style={{display:'flex',alignItems:'center',gap:8}}><span className="muted">Refresh</span><select value={intervalMs} onChange={e=>setIntervalMs(Number(e.target.value))} style={{background:'transparent',border:'none',color:'inherit'}}><option value="3000">3 sec</option><option value="5000">5 sec</option><option value="10000">10 sec</option></select></div><button className="btn" onClick={()=>setGuide('signal')}>Guide</button></div></div></div>
    </div>
    <div className="tabs" style={{marginBottom:16}}>{[['overview','Vue globale'],['detail','Détail'],['heatmap','Heatmap'],['compare','Comparatif']].map(([k,l])=><button key={k} className={`btn ${view===k?'active':''}`} onClick={()=>setView(k)}>{l}</button>)}</div>
    {view==='overview' && <div className="overview">{tickers.map(k=>{const b=BASE[k],p=prices[k],chg=getChange(k),pos=pos52(k),hist=[...b.hist.slice(0,-1),p]; return <div key={k} className={`card ${active===k?'active':''}`} onClick={()=>{setActive(k);setView('detail')}}><div className="between"><div><div className="ticker">{k}</div><div className="muted">{b.name}</div></div><span className="badge" style={{color:colorSignal(b.signal)}}>{b.signal}</span></div><div className="price">{fmt(p)}</div><div className={chg>=0?'up':'down'} style={{fontWeight:700}}>{pct(chg)}</div><div className="mini"><Spark values={hist} color={b.color}/></div><div className="range"><div style={{position:'absolute',left:0,top:0,bottom:0,width:`${pos}%`,background:`linear-gradient(90deg,var(--green),${b.color})`,borderRadius:999}}></div><div className="dot" style={{left:`${pos}%`,background:b.color,border:'2px solid var(--bg)'}}></div></div><div className="between muted" style={{fontSize:11,marginTop:5}}><span>{b.low52}</span><span>{Math.round(pos)}%</span><span>{b.high52}</span></div><div className="meta3"><div className="metric"><div className="k">PE</div><div className="v">{b.pe>300?'300+':b.pe}</div></div><div className="metric"><div className="k">Upside T3</div><div className={`v ${getUpside(k)>0?'up':'down'}`}>{getUpside(k)}%</div></div><div className="metric"><div className="k">Conviction</div><div className="v">{stars(b.conviction)}</div></div></div></div>})}</div>}
    {view==='detail' && <div className="detail"><div className="stack"><div className="panel p"><div className="between"><div><div className="eyebrow">{activeBase.sector}</div><div style={{fontSize:28,fontWeight:700}}>{activeBase.name} <span className="muted" style={{fontSize:14}}>{active}</span></div><div className="row"><span className="badge" style={{color:colorSignal(activeBase.signal)}}>{activeBase.signal}</span><span className="btn" style={{padding:'6px 10px'}}>Ticker actif</span><span className="btn" style={{padding:'6px 10px'}}>{activeBase.pilier}</span></div></div><div><div style={{fontSize:38,fontWeight:700}}>{fmt(activePrice)}</div><div className={getChange(active)>=0?'up':'down'} style={{fontWeight:700}}>{pct(getChange(active))}</div></div></div><p className="muted" style={{marginTop:12}}>{activeBase.signalDesc}</p><div className="meta3"><div className="metric"><div className="k">Zone d'entrée</div><div className="v">{activeBase.entryLow} - {activeBase.entryHigh}</div></div><div className="metric"><div className="k">Stop loss</div><div className="v down">{activeBase.stop}</div></div><div className="metric"><div className="k">RR vers T2</div><div className={`v ${rr(activeBase.t2)>=2?'up':'down'}`}>{rr(activeBase.t2)}:1</div></div></div><div className="subtabs" style={{marginTop:14}}>{[['chart','Graphique'],['levels','Niveaux'],['fund','Fondamentaux'],['oracle','Oracle'],['narrative','Narratif']].map(([k,l])=><button key={k} className={`btn ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</button>)}<button className="btn" onClick={()=>setGuide('rr')}>Guide RR</button></div></div>
        <div className={`panel p subview ${tab==='chart'?'active':''}`}><div className="eyebrow">Évolution 6 mois</div><div className="chart"><Area values={[...activeBase.hist.slice(0,-1),activePrice]} color={activeBase.color} refs={[activeBase.t1,activeBase.t2,activeBase.t3,activeBase.stop]}/></div></div>
        <div className={`panel p subview ${tab==='levels'?'active':''}`}><div className="eyebrow">Niveaux et RR</div>{[activeBase.t1,activeBase.t2,activeBase.t3].map((t,i)=>{const gain=t-entryMid,loss=entryMid-activeBase.stop,ratio=(gain/loss).toFixed(1);return <div key={i} className="between" style={{padding:'12px 0',borderBottom:'1px solid var(--border)'}}><div><strong>Vers T{i+1}</strong><div className="muted">Gain {gain.toFixed(1)} · Risque {loss.toFixed(1)}</div></div><div style={{textAlign:'right'}}><strong className={ratio>=2?'up':'down'}>{ratio}:1</strong><div className="muted">{ratio>=3?'Excellent':ratio>=2?'Acceptable':'À éviter'}</div></div></div>})}</div>
        <div className={`panel p subview ${tab==='fund'?'active':''}`}><div className="eyebrow">Métriques financières</div><div className="meta3" style={{gridTemplateColumns:'repeat(2,1fr)'}}><div className="metric"><div className="k">PE</div><div className="v">{activeBase.pe>300?'300+':activeBase.pe}</div></div><div className="metric"><div className="k">PE forward</div><div className="v">{activeBase.fwdPe}</div></div><div className="metric"><div className="k">Croissance CA</div><div className={`v ${activeBase.revGrowth>0?'up':'down'}`}>{activeBase.revGrowth}%</div></div><div className="metric"><div className="k">Marge brute</div><div className="v">{activeBase.grossMargin}%</div></div><div className="metric"><div className="k">Cap. boursière</div><div className="v">{activeBase.mktcap}</div></div><div className="metric"><div className="k">Résultats</div><div className="v">{activeBase.earningsDate}</div></div></div></div>
        <div className={`panel p subview ${tab==='oracle'?'active':''}`}><div className="eyebrow">Analyse concurrentielle</div><div className="meta3" style={{gridTemplateColumns:'repeat(2,1fr)'}}>{activeBase.peers.map((p,i)=><div key={i} className="metric"><div className="v">{p[0]}</div><div className="muted">PE {p[1]} · Growth {p[2]}% · Marge {p[3]}%</div><span className="badge" style={{color:p[5],marginTop:6}}>{p[4]}</span></div>)}</div></div>
        <div className={`panel p subview ${tab==='narrative'?'active':''}`}><div className="meta3" style={{gridTemplateColumns:'repeat(2,1fr)'}}><div className="metric"><div className="eyebrow" style={{color:'var(--green)'}}>Thèse</div><div style={{marginTop:8}}>{activeBase.thesis}</div></div><div className="metric"><div className="eyebrow" style={{color:'var(--red)'}}>Risques</div><div style={{marginTop:8}}>{activeBase.risks}</div></div></div></div>
      </div><div className="stack"><div className="panel p"><div className="eyebrow">Synthèse d'action</div><div className="meta3" style={{gridTemplateColumns:'repeat(2,1fr)',marginTop:12}}><div className="metric"><div className="k">Signal</div><div className="v" style={{color:colorSignal(activeBase.signal)}}>{activeBase.signal}</div></div><div className="metric"><div className="k">Conviction</div><div className="v">{stars(activeBase.conviction)}</div></div><div className="metric"><div className="k">Upside T3</div><div className={`v ${getUpside(active)>0?'up':'down'}`}>{getUpside(active)}%</div></div><div className="metric"><div className="k">Statut entrée</div><div className={`v ${activePrice<activeBase.entryLow?'up':activePrice>activeBase.entryHigh?'down':''}`}>{activePrice<activeBase.entryLow?'Sous la zone':activePrice>activeBase.entryHigh?'Au-dessus':'Dans la zone'}</div></div></div></div><div className="panel p"><div className="eyebrow">Navigation titres</div><div className="row" style={{marginTop:10}}>{Object.keys(BASE).map(k=><button key={k} className="btn" style={{borderColor:active===k?BASE[k].color:'var(--border)',color:active===k?BASE[k].color:'var(--text)'}} onClick={()=>setActive(k)}>{k}</button>)}</div></div></div></div>}
    {view==='heatmap' && <div className="panel p"><div className="between"><div><div className="eyebrow">Heatmap</div><div className="muted">Clique les colonnes pour trier</div></div><button className="btn" onClick={()=>setGuide('heatmap')}>Guide</button></div><div className="heatmap-wrap" style={{marginTop:16}}><table><thead><tr><th>Titre</th>{['PE','Growth','Margin','Upside','Conviction'].map(m=><th key={m} onClick={()=>setHeatSort(m)} style={{cursor:'pointer'}}>{m}</th>)}</tr></thead><tbody>{[...tickers].sort((a,b)=>heatVal(b,heatSort)-heatVal(a,heatSort)).map(k=><tr key={k}><td><button className="btn" onClick={()=>{setActive(k);setView('detail')}}>{k}</button></td>{['PE','Growth','Margin','Upside','Conviction'].map(m=>{const v=heatVal(k,m),c=heatColor(v,m);return <td key={m}><div className="heat" style={{background:c+'22',color:c,borderColor:c+'44'}}>{m==='Conviction'?`${BASE[k].conviction}/5`:m==='Upside'?`${v}%`:v}</div></td>})}</tr>)}</tbody></table></div></div>}
    {view==='compare' && <div className="stack"><div className="panel p"><div className="between"><div><div className="eyebrow">Radar comparatif</div><div className="muted">Comparaison des profils</div></div><button className="btn" onClick={()=>setGuide('radar')}>Guide</button></div><div style={{marginTop:12}}><Radar/></div></div><div className="panel p"><div className="eyebrow">Tableau récapitulatif</div><div className="table-wrap" style={{marginTop:12}}><table><thead><tr><th>Titre</th><th>Prix</th><th>Chg</th><th>Signal</th><th>PE</th><th>Rev.</th><th>Marge</th><th>Entrée</th><th>T3</th><th>SL</th></tr></thead><tbody>{tickers.map(k=><tr key={k}><td><button className="btn" onClick={()=>{setActive(k);setView('detail')}}>{k}</button></td><td>{fmt(prices[k])}</td><td className={getChange(k)>=0?'up':'down'}>{pct(getChange(k))}</td><td><span className="badge" style={{color:colorSignal(BASE[k].signal)}}>{BASE[k].signal}</span></td><td>{BASE[k].pe>300?'300+':BASE[k].pe}</td><td>{BASE[k].revGrowth}%</td><td>{BASE[k].grossMargin}%</td><td>{BASE[k].entryLow}-{BASE[k].entryHigh}</td><td>{BASE[k].t3}</td><td>{BASE[k].stop}</td></tr>)}</tbody></table></div></div></div>}
    {guide && <div className="guide" onClick={e=>e.target.className==='guide'&&setGuide(null)}><div className="guide-box"><div className="between"><strong>Guide {guide}</strong><button className="btn" onClick={()=>setGuide(null)}>Fermer</button></div><p className="muted" style={{marginTop:12}}>{GUIDES[guide]}</p></div></div>}
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
